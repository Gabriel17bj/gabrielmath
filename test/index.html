:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* ---------- top bar ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
.bar-in{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:10px 18px}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand h1{font-family:var(--serif);font-weight:700;font-size:20px;margin:0;letter-spacing:-.02em}
.brand span{color:var(--ink-3);font-size:12px}
.paperpick{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.paperpick select{min-width:220px;max-width:46vw}
.status{font-size:12px;color:var(--ink-3);min-width:70px;text-align:right}
.tabs{display:flex;gap:2px;padding:0 18px;overflow-x:auto}
.tabs a{padding:9px 14px;color:var(--ink-2);text-decoration:none;border-bottom:2px solid transparent;white-space:nowrap;font-weight:500}
.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--pen)}
.tabs a .n{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;border-radius:9px;background:var(--panel-2);font-size:11px;color:var(--ink-2);text-align:center}

/* ---------- controls ---------- */
.btn{border:1px solid var(--line);background:var(--panel);padding:6px 12px;border-radius:6px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--panel-2)}
.btn.primary{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.btn.primary:hover{opacity:.9}
.btn.pen{background:var(--pen);color:#fff;border-color:var(--pen)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.small{padding:3px 8px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
select,input[type=text],input[type=number],textarea{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 8px;width:100%}
textarea{resize:vertical;min-height:64px;line-height:1.55}
textarea.code{font-family:var(--serif);font-size:13.5px}
label.f{display:block;font-size:12px;color:var(--ink-2);margin:10px 0 4px;font-weight:500}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:5px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.hint{font-size:12px;color:var(--ink-3)}

/* ---------- layout ---------- */
main{padding:18px;max-width:1500px;margin:0 auto}
.grid2{display:grid;grid-template-columns:minmax(320px,440px) 1fr;gap:18px;align-items:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px}
.card h2{font-family:var(--serif);font-size:17px;margin:0 0 4px}
.card h3{font-size:13px;margin:16px 0 6px;color:var(--ink-2)}
@media (max-width:900px){.grid2{grid-template-columns:1fr}.bar-in{padding:10px 12px}main{padding:12px}.paperpick select{max-width:100%;min-width:0;flex:1}}

/* standards picker */
.stdlist{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:4px 8px;background:var(--panel-2)}
.stdlist .u{font-size:11.5px;color:var(--ink-3);margin:8px 0 2px;font-weight:600}
.stdlist label{display:flex;gap:8px;align-items:flex-start;padding:3px 0;font-size:12.5px;cursor:pointer}
.stdlist code{font-family:var(--gothic);font-size:11.5px;color:var(--ink);white-space:nowrap}
.unv{color:var(--warn);font-size:11px}

/* plan table */
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:6px 6px;text-align:left;vertical-align:top}
table.t th{font-size:11.5px;color:var(--ink-3);font-weight:600}
.pill{display:inline-block;padding:1px 7px;border-radius:9px;font-size:11.5px;background:var(--panel-2);color:var(--ink-2)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.err{background:var(--pen-soft);color:var(--pen)}.pill.run{background:var(--warn-soft);color:var(--warn)}
.log{font-family:var(--serif);white-space:pre-wrap;background:var(--panel-2);border-radius:6px;padding:10px 12px;font-size:13px;max-height:340px;overflow:auto;margin-top:10px}

/* items tab */
.itemlist{display:flex;flex-direction:column;gap:2px;max-height:70vh;overflow:auto}
.itemlist button{display:grid;grid-template-columns:34px 1fr auto;gap:8px;text-align:left;border:0;background:transparent;padding:8px;border-radius:6px;cursor:pointer;align-items:center}
.itemlist button[aria-current="true"]{background:var(--panel-2);box-shadow:inset 3px 0 0 var(--pen)}
.itemlist button>span{min-width:0}
.itemlist .no{font-family:var(--serif);font-weight:700;font-size:16px}
.itemlist .meta{font-size:12px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.issues{margin:0;padding:0;list-style:none;font-size:12.5px}
.issues li{padding:5px 8px;border-radius:5px;margin-bottom:3px}
.issues li.e{background:var(--pen-soft);color:var(--pen)}.issues li.w{background:var(--warn-soft);color:var(--warn)}
.choicegrid{display:grid;grid-template-columns:28px 1fr;gap:6px 8px;align-items:center}
.choicegrid input[type=radio]{width:16px;height:16px;accent-color:var(--pen)}
.empty{padding:40px 16px;text-align:center;color:var(--ink-2)}
.empty p{max-width:420px;margin:6px auto 14px}
.mini-prev{border:1px solid var(--line);border-radius:6px;background:#fff;color:#111;padding:14px 16px;margin-top:8px;font-family:var(--serif);font-size:14px;line-height:1.7}

/* ---------- preview ---------- */
.pv-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.pv-wrap{display:flex;flex-direction:column;align-items:center;gap:18px;overflow:hidden}
.pv-slot{position:relative}
.pv-slot>.sheet{position:absolute;top:0;left:0;transform-origin:0 0;box-shadow:0 1px 3px rgba(20,25,35,.18),0 8px 24px rgba(20,25,35,.12)}

/* ---------- exam sheet (always paper white) ---------- */
.sheet{width:210mm;height:297mm;background:#fff;color:#111;padding:11mm 13mm 0;position:relative;font-family:var(--serif);font-size:10pt;line-height:1.72;overflow:hidden}
.sheet .hd1{height:42mm;position:relative;border-bottom:1.6pt solid #111}
.sheet .hd1 .t{text-align:center;font-family:var(--gothic);font-size:8.5pt;color:#333}
.sheet .hd1 .a{text-align:center;font-family:var(--gothic);font-weight:800;font-size:25pt;margin-top:2mm;letter-spacing:-.01em}
.sheet .hd1 .per{position:absolute;left:0;top:9mm;border:1pt solid #111;border-radius:6pt;padding:1.5mm 4mm;font-family:var(--gothic);font-weight:800;font-size:13pt}
.sheet .hd1 .frm{position:absolute;right:0;top:9mm;border:1pt solid #111;padding:1.5mm 4mm;font-family:var(--gothic);font-weight:800;font-size:13pt}
.sheet .hd1 .id{position:absolute;left:30mm;right:16mm;bottom:4mm;display:flex;gap:10mm;font-family:var(--gothic);font-size:9pt}
.sheet .hd1 .id div{border:.6pt solid #111;height:8mm;display:flex;align-items:center;padding-left:2mm}
.sheet .hd1 .id .nm{width:45mm}.sheet .hd1 .id .num{flex:1;padding-left:0}.sheet .hd1 .id .num span{padding:0 3mm 0 2mm;align-self:center}.sheet .hd1 .id .num i{flex:1;height:100%;border-left:.6pt solid #111}
.sheet .hd2{height:13mm;border-bottom:1.2pt solid #111;display:flex;align-items:flex-end;justify-content:space-between;padding-bottom:1.5mm;font-family:var(--gothic)}
.sheet .hd2 b{font-size:13pt;font-weight:800}.sheet .hd2 span{font-size:9pt}
.sheet .hd2.even{flex-direction:row}.sheet .hd2.odd{flex-direction:row-reverse}
.sheet .cols{display:flex;gap:0;margin-top:4mm}
.sheet .col{flex:1;min-width:0;overflow:hidden;padding-right:4mm}
.sheet .col+.col{border-left:.5pt solid #111;padding-right:0;padding-left:4mm}
.sheet.first .cols{height:219mm}.sheet.other .cols{height:248mm}
.sheet .one{height:248mm;margin-top:4mm;overflow:hidden}
.sheet .ft{position:absolute;left:13mm;right:13mm;bottom:0;height:13mm;border-top:.6pt solid #111;display:flex;align-items:center;justify-content:center;font-family:var(--gothic)}
.sheet .ft b{font-size:11pt}.sheet .ft span{position:absolute;left:0;font-size:6.5pt;color:#444}
:is(.sheet,.mini-prev) .q{margin-bottom:7mm;break-inside:avoid}
:is(.sheet,.mini-prev) .stem{margin:0;padding-left:1.2em;text-indent:-1.2em;text-align:justify}
:is(.sheet,.mini-prev) .stem b.qn{font-family:var(--gothic);font-weight:800}
:is(.sheet,.mini-prev) .box{border:.6pt solid #111;padding:1.5mm 3mm;margin:2mm 2mm 2mm 1.2em;font-size:9.6pt;line-height:1.65}
:is(.sheet,.mini-prev) .bogi{position:relative;margin-top:4mm;padding-top:3mm}
:is(.sheet,.mini-prev) .bogi .bt{position:absolute;top:-2.4mm;left:50%;transform:translateX(-50%);background:#fff;padding:0 2mm;font-size:9.4pt;line-height:1}
:is(.sheet,.mini-prev) .q-after{margin:1.5mm 0 0 1.2em;text-align:justify}
:is(.sheet,.mini-prev) .ch{display:grid;margin:2mm 0 0 1.2em;gap:.5mm 2mm}
:is(.sheet,.mini-prev) .ch.c5{grid-template-columns:repeat(5,1fr)}:is(.sheet,.mini-prev) .ch.c3{grid-template-columns:repeat(3,1fr)}:is(.sheet,.mini-prev) .ch.c1{grid-template-columns:1fr}
:is(.sheet,.mini-prev) .ch div{padding-left:1.45em;text-indent:-1.45em}
:is(.sheet,.mini-prev) .cn{display:inline-block;width:1.08em;height:1.08em;border:.07em solid currentColor;border-radius:50%;font-family:var(--gothic);font-size:.82em;line-height:1em;text-align:center;text-indent:0;vertical-align:.08em;margin-right:.45em;box-sizing:border-box}
:is(.sheet,.mini-prev) .sa{height:30mm}:is(.sheet,.mini-prev) .sa.big{height:44mm}
:is(.sheet,.mini-prev) .inst{font-weight:700;margin:0 0 1.5mm}
:is(.sheet,.mini-prev) .psg{text-indent:1em;text-align:justify;margin:0;font-size:9.7pt;line-height:1.7}
:is(.sheet,.mini-prev) .psg-end{margin-bottom:6mm}
.sheet .chk{border:.6pt solid #111;padding:2mm 3mm;font-family:var(--gothic);font-size:8.5pt;line-height:1.5}
:is(.sheet,.mini-prev) sup{font-size:.68em;line-height:0;vertical-align:.6em}:is(.sheet,.mini-prev) sub{font-size:.68em;line-height:0;vertical-align:-.25em}
:is(.sheet,.mini-prev) i{font-family:"Times New Roman",Times,"Nanum Myeongjo",serif;font-size:1.05em}
.sheet h3.st{font-family:var(--gothic);font-weight:800;font-size:15pt;text-align:center;margin:2mm 0 4mm}
.sheet table.ak{width:100%;border-collapse:collapse;font-family:var(--gothic);font-size:9pt;text-align:center;margin-bottom:6mm}
.sheet table.ak th,.sheet table.ak td{border:.5pt solid #111;padding:1.2mm 0}
.sheet table.ak th{background:#ececec}
.sheet .ex{margin-bottom:6mm;font-size:9.6pt}
.sheet .ex h4{font-family:var(--gothic);font-size:11pt;margin:0 0 1.5mm}
.sheet .ex table{width:100%;border-collapse:collapse;font-family:var(--gothic);font-size:8.6pt;margin-bottom:2mm;line-height:1.45}
.sheet .ex th,.sheet .ex td{border:.4pt solid #888;padding:1mm 1.6mm;text-align:left;vertical-align:middle}
.sheet .ex th{background:#f0f0f0;width:22mm;white-space:nowrap}
.sheet .ex p{margin:0 0 1mm;text-align:justify}
.sheet .ex .lb{font-weight:700}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:9px 16px;border-radius:8px;font-size:13px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.offstage{position:fixed;left:-30000px;top:0}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
#printRoot{display:none}
.brand{align-items:center}
.logo{display:block;flex:none;border-radius:50%}

.titlebtn{border:0;background:none;padding:0;margin:0;font:inherit;color:inherit;cursor:pointer;letter-spacing:inherit}

.areabtns{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:8px}

ul.plist{list-style:none;margin:8px 0;padding:0;display:flex;flex-direction:column;gap:6px}
ul.plist li{display:flex;gap:10px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
ul.plist li.on{border-color:var(--pen)}
ul.plist li>div:first-child{flex:1;min-width:0}

ul.plist input:hover,ul.plist input:focus{border-color:var(--line)}
.pbtns{display:flex;gap:4px;flex:none}

.fmt3 .btn{padding:9px 6px;font-weight:600}
.fmt3 .btn small{display:block;font-weight:400;font-size:11px;color:var(--ink-3)}
.saverow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px}
#pmodal{position:fixed;inset:0;z-index:30}
#pmodal[hidden]{display:none}
.pm-back{position:absolute;inset:0;background:rgba(10,14,22,.55)}
.pm{position:relative;margin:calc(4vh + env(safe-area-inset-top,0px)) auto 0;max-width:760px;width:calc(100% - 24px);max-height:calc(92vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;background:var(--panel);border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.pm-h{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.pm-h h2{margin:0;font-family:var(--serif);font-size:18px}
.pm-sum{margin:12px 18px 0;padding:10px 14px;border-radius:8px;background:var(--warn-soft);font-size:13.5px}
.pm-sum ul{margin:6px 0 0;padding-left:18px}
.pm-body{padding:6px 18px 12px;overflow:auto;font-size:13.5px;line-height:1.7}
.pm-body h1{font-size:17px;font-family:var(--serif);margin:12px 0 4px}
.pm-body h2{font-size:14.5px;margin:16px 0 4px}

.errbox{background:var(--pen-soft);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-top:8px;font-size:13px;color:var(--ink)}

.fix{margin-top:6px}

mjx-container[jax="SVG"]{direction:ltr}

.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--warn-soft);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-bottom:14px}

  @page{size:A4;margin:0}

}

<body>
<header class="bar">

<h2>제8조 (개인정보의 제3자 제공 및 국외 이전)</h2>
<ol>
<li>운영자는 이용자의 개인정보를 제3자에게 제공하거나 국외로 이전하지 않습니다.</li>
<li>다만 이용자가 AI 기능을 사용하면, 문항을 만들기 위해 다음 내용이 이용자가 입력한 API 키를 발급한 AI 서비스로 전송됩니다. 예: Google(미국)의 Gemini, OpenAI(미국)의 ChatGPT, Anthropic(미국)의 Claude, xAI(미국)의 Grok, Groq(미국), OpenRouter(미국, 이용자가 고른 모델의 제공 회사로 다시 전달), DeepSeek(중국), Mistral(프랑스), Upstage(대한민국), Perplexity(미국), 이용자가 직접 입력한 OpenAI 호환 주소.<ul>
<li><strong>전송 항목:</strong> 문항 조건(영역, 과목, 단원, 성취기준, 문항 유형, 행동영역, 난이도, 배점), 이용자가 붙여 넣은 참고 문항 원문과 추가 조건, 지문 세트의 지문, 검토를 요청한 문항의 내용, 지문 작성을 요청한 주제. 브라우저 저장소의 다른 시험지와 설정은 보내지 않습니다.</li>
<li><strong>전송 경로:</strong> 이용자 브라우저에서 해당 AI 서비스의 서버(예: generativelanguage.googleapis.com, api.openai.com, api.anthropic.com)로 직접 전송. 운영자 서버를 거치지 않으며, API 키는 요청 인증과 사용 가능한 모델 목록 확인에만 사용</li>
<li><strong>전송 시점:</strong> 이용자가 [연결하기], [문항 생성 시험], [이 문항 생성], [계획표 전체 생성], [검토위원 재풀이], [AI로 지문 쓰기]를 누를 때</li>
<li><strong>보관 기간:</strong> 해당 AI 서비스의 개인정보 처리방침과 이용 조건에 따름</li>
<li><strong>거부 방법:</strong> AI 기능을 쓰지 않으면 아무것도 전송되지 않으며, 문항 직접 입력·편집·인쇄·저장 기능은 제한 없이 쓸 수 있습니다.</li>
</ul>
</li>
</ol>
<h2>제9조 (AI 서비스 API 이용에 관한 사항)</h2>
<ol>
<li><strong>키의 발급과 관리:</strong> API 키는 이용자가 각 AI 서비스에서 개인적으로 만들어 입력합니다. 운영자는 키를 발급하거나 대신 보관하지 않으며, 키의 관리 책임은 이용자에게 있습니다. 공용 컴퓨터에서는 ‘이 브라우저에 키 기억하기’를 끄고, 사용 후 [연결 해제·키 지우기]를 누르세요.</li>
<li><strong>요금:</strong> API 사용 요금은 키를 발급받은 이용자의 계정에 청구됩니다. 운영자는 요금을 받거나 대신 내지 않습니다.</li>
<li><strong>무료 등급의 데이터 이용:</strong> 일부 AI 서비스의 무료 등급(예: Gemini API 무료 사용량)은 이용자가 보낸 내용과 응답을 서비스 개선에 쓰고, 품질 향상을 위해 사람이 검토할 수 있습니다. 공개 전 시험 문항처럼 보안이 필요한 내용은 데이터를 학습에 쓰지 않는 유료 등급을 이용하세요.</li>
<li><strong>서비스 이용 조건 준수:</strong> 이용자는 각 AI 서비스의 이용 약관과 사용 정책(연령, 지역, 금지 용도 포함)을 따라야 합니다.</li>
<li><strong>생성 결과의 검토:</strong> AI가 만든 문항, 정답, 해설은 틀릴 수 있습니다. 시험에 쓰기 전에 교사가 직접 풀어 보고 교육과정 범위와 정답 유일성을 확인해야 합니다.</li>
<li><strong>저작권:</strong> 참고 문항으로 평가원 기출문제 등 저작물을 붙여 넣을 때에는 해당 저작물의 이용 조건을 지켜야 하며, 이 앱은 원문을 그대로 옮기지 않고 구조만 참고하도록 AI에 요청합니다.</li>
</ol>

function allStandards(area) {

    for (const [subj, body] of Object.entries(subjects)) for (const [unit, list] of Object.entries(body.units)) list.forEach(s => add(a, subj, unit, s, false));
  }

}
const stdIndex = () => Object.fromEntries(allStandards().map(s => [s.code, s]));

function validate(p) {
  const cfg = BP.areas[p.area], idx = stdIndex(), out = [];
  const E = (n, m) => out.push({ n, lv: "e", m }), W = (n, m) => out.push({ n, lv: "w", m });
  const nums = p.items.map(i => i.number);
  if (new Set(nums).size !== nums.length) E(null, "문항 번호가 중복되었습니다.");
  for (const it of p.items) {
    const n = it.number;
    if (!cfg.points_allowed.includes(+it.points)) E(n, `배점 ${it.points}점은 허용 범위(${cfg.points_allowed.join("·")}점) 밖입니다.`);
    if (it.choices.length) {
      if (it.choices.length !== 5) E(n, `선지가 ${it.choices.length}개입니다. 5개여야 합니다.`);
      if (!["1","2","3","4","5"].includes(String(it.answer))) E(n, "5지선다 정답은 1~5 중 하나여야 합니다.");
      if (new Set(it.choices).size !== it.choices.length) E(n, "같은 선지가 두 번 있습니다.");
      if (it.choices.some(c => !String(c).trim())) E(n, "비어 있는 선지가 있습니다.");
    } else if (p.area !== "math") E(n, "단답형은 수학 영역에서만 쓸 수 있습니다.");
    else if (!/^\d{1,3}$/.test(String(it.answer))) E(n, "단답형 정답은 0~999 정수여야 합니다.");
    if (!it.meta.standards.length) E(n, "성취기준이 지정되지 않았습니다.");
    it.meta.standards.forEach(c => { if (!idx[c]) E(n, `성취기준 ${c}가 목록에 없습니다.`); else if (!idx[c].verified) W(n, `성취기준 ${c} 원문 대조가 끝나지 않았습니다.`); });
    if (!cfg.subjects.includes(it.meta.subject)) E(n, `과목 ‘${it.meta.subject}’은 ${cfg.name} 출제과목이 아닙니다.`);
    if (!String(it.stem).trim()) E(n, "발문이 비어 있습니다.");
    if (!String(it.explanation).trim()) E(n, "해설이 없습니다.");
  }
  const mc = p.items.filter(i => i.choices.length).map(i => String(i.answer));
  if (mc.length >= 10) for (const k of "12345") { const c = mc.filter(x => x === k).length; if (c > mc.length * .35) W(null, `정답 ${k}번이 ${c}/${mc.length}개로 많습니다.`); }
  return out;
}

const CSP_BLOCKED = new Set();
document.addEventListener("securitypolicyviolation", e => { try { CSP_BLOCKED.add(new URL(e.blockedURI).host); } catch (_) { CSP_BLOCKED.add(String(e.blockedURI)); } });

async function diagnose(url) {
  if (navigator.onLine === false) return "offline";
  const host = new URL(url).host, tick = () => new Promise(r => setTimeout(r, 60));
  await tick();
  if (CSP_BLOCKED.has(host)) return "blocked_preview";
  try { await fetch(`https://${host}/`, { mode: "no-cors", cache: "no-store" }); }
  catch (e) { await tick(); if (CSP_BLOCKED.has(host) || PREVIEWISH) return "blocked_preview"; return "firewall"; }
  return "cors";
}
function authHeaders(prov, key) {
  const k = PROVIDERS[prov].kind;
  if (k === "anthropic") return { "x-api-key": key, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" };
  if (k === "gemini") return {};                       // Gemini는 ?key= 로 보내 사전 요청(preflight)을 줄인다
  const h = { Authorization: `Bearer ${key}` };
  if (prov === "openrouter") { h["HTTP-Referer"] = location.origin.startsWith("http") ? location.origin : "https://gabrielmath.kr"; h["X-Title"] = "Suneung Item Maker"; }
  return h;
}
const gUrl = (u, key) => u + (u.includes("?") ? "&" : "?") + "key=" + encodeURIComponent(key);
async function httpJSON(url, opt = {}) {
  let res;
  try { res = await fetch(url, opt); }
  catch (e) {
    if (e?.name === "AbortError") throw { code: "cancelled" };
    const why = await diagnose(url);
    throw { code: why, host: new URL(url).host };
  }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const err = data?.error || {}, m = (typeof err === "string" ? err : err.message) || data?.message || `HTTP ${res.status}`;
    const reason = (err.details || []).map(d => d.reason).filter(Boolean).join(",") + " " + (err.status || "");
    let code;
    if (/REFERRER_BLOCKED|IP_ADDRESS_BLOCKED|referer.*blocked/i.test(reason + m)) code = "referrer_blocked";
    else if (/SERVICE_DISABLED|has not been used in project|is disabled/i.test(reason + m)) code = "api_disabled";
    else if (/location is not supported|not available in your country|FAILED_PRECONDITION.*location/i.test(m)) code = "region";
    else if (/API_KEY_INVALID|API key not valid|API key expired|invalid.*api.?key|incorrect api key|unauthori[sz]ed/i.test(reason + m) || res.status === 401) code = "bad_key";
    else if (res.status === 403) code = "bad_key";
    else if (res.status === 402 || /credit|balance|insufficient|billing/i.test(m)) code = "no_credit";
    else if (res.status === 429 && /limit: ?0\b|free_tier.*limit.*0/i.test(m)) code = "quota_zero";
    else if (res.status === 429 || /RESOURCE_EXHAUSTED/.test(reason)) code = "rate_limited";
    else if (res.status === 404 || /model.*(not|does not) exist|not found/i.test(m)) code = "bad_model";
    else code = "api_error";
    throw { code, status: res.status, message: `${m} (HTTP ${res.status})` };
  }
  return data;
}

async function listModels(prov, key, base) {
  const P = PROVIDERS[prov], b = (prov === "custom" ? base : P.base).replace(/\/+$/, "");
  if (P.noList) { await chatOnce(prov, key, b, P.fallback[0], "ok라고만 답하시오."); return P.fallback.slice(); }
  if (P.kind === "gemini") {
    const d = await httpJSON(gUrl(`${b}/models?pageSize=200`, key));
    return (d.models || []).filter(m => (m.supportedGenerationMethods || []).includes("generateContent")).map(m => m.name.replace(/^models\//, ""));
  }
  const d = await httpJSON(`${b}/models${P.kind === "anthropic" ? "?limit=100" : ""}`, { headers: authHeaders(prov, key) });
  const ids = (d.data || d.models || []).map(m => m.id || m.name).filter(Boolean);
  if (!ids.length && P.fallback) return P.fallback.slice();
  return ids;
}
const ENV_CODES = ["blocked_preview", "firewall", "offline"];
async function connectKey(key, forced, base, onStep = () => {}) {
  key = key.trim().replace(/^Bearer\s+/i, "").replace(/\s+/g, "");
  const cands = forced ? [forced] : DETECT_ORDER.filter(p => PROVIDERS[p].test(key));
  onStep("detect", "ok", cands.length === 1 ? `${PROVIDERS[cands[0]].name} 키` : cands.length ? `${cands.map(c => PROVIDERS[c].name).join(" 또는 ")} 키로 보임` : "형식을 모르는 키 — 여러 서비스에 차례로 확인");
  if (!cands.length) cands.push("openai", "mistral", "deepseek");
  let last;
  for (const prov of cands) {
    onStep("server", "run", `${PROVIDERS[prov].name} 서버에 확인하는 중…`);
    try {
      const ids = await listModels(prov, key, base);
      onStep("server", "ok", `${PROVIDERS[prov].name} 서버가 키를 확인했습니다`);
      const usable = ids.filter(i => !BAD_MODEL.test(i));
      const model = (PROVIDERS[prov].pick || (x => x[0]))(usable.length ? usable : ids);
      if (!model) throw { code: "bad_model", message: "쓸 수 있는 모델이 없습니다." };
      onStep("model", "ok", model);
      return { provider: prov, models: (usable.length ? usable : ids).slice(0, 300), model };
    } catch (e) { last = e; if (ENV_CODES.includes(e.code)) break; }
  }
  const err = last?.code === "bad_key" && !forced && cands.length > 1 ? { code: "unknown_key" } : (last || { code: "unknown_key" });
  onStep("server", "err", errMsg(err));
  throw err;
}
async function chatOnce(prov, key, base, model, prompt, { signal, json } = {}) {
  const P = PROVIDERS[prov];
  if (P.kind === "anthropic") {
    const d = await httpJSON(`${base}/messages`, { method: "POST", signal, headers: { "content-type": "application/json", ...authHeaders(prov, key) },
      body: JSON.stringify({ model, max_tokens: 8000, messages: [{ role: "user", content: prompt }] }) });
    return (d.content || []).filter(x => x.type === "text").map(x => x.text).join("");
  }
  if (P.kind === "gemini") {
    const d = await httpJSON(gUrl(`${base}/models/${encodeURIComponent(model)}:generateContent`, key), { method: "POST", signal, headers: { "content-type": "application/json" },
      body: JSON.stringify({ contents: [{ role: "user", parts: [{ text: prompt }] }], generationConfig: json ? { responseMimeType: "application/json" } : {} }) });
    const c = d.candidates?.[0];
    if (!c && d.promptFeedback?.blockReason) throw { code: "api_error", message: `요청이 차단되었습니다 (${d.promptFeedback.blockReason})` };
    return (c?.content?.parts || []).filter(x => !x.thought).map(x => x.text || "").join("");
  }
  const d = await httpJSON(`${base}/chat/completions`, { method: "POST", signal, headers: { "content-type": "application/json", ...authHeaders(prov, key) },
    body: JSON.stringify({ model, messages: [{ role: "user", content: prompt }] }) });
  const m = d.choices?.[0]?.message?.content;
  return (Array.isArray(m) ? m.map(x => x.text || "").join("") : m || "").replace(/<think>[\s\S]*?<\/think>/gi, "");
}
async function aiCall(prompt, { onText, signal, json = false } = {}) {
  if (!aiReady()) throw { code: "no_ai" };
  if (AI.provider === "claude_account") {
    const { text } = await sampleFn(prompt, { modelTier: "complex", signal, cache: false, onText: onText ? ({ text }) => onText(text) : undefined });
    return text;
  }
  const text = await chatOnce(AI.provider, AI.key, aiBase(), aiModel(), prompt, { signal, json });
  if (!text.trim()) throw { code: "empty" };
  onText && onText(text);
  return text;
}

async function generateOne(spec, onProgress, signal) {
  const p = cur(); let d, lastErr;
  for (let attempt = 0; attempt < 2 && !d; attempt++) {
    const text = await aiCall(buildPrompt(spec, p), { signal, json: true, onText: t => onProgress && onProgress(t) });
    try { d = parseJSON(text); } catch (e) { lastErr = { code: "parse" }; if (onProgress) onProgress("형식이 맞지 않아 한 번 더 요청합니다…"); }
  }
  if (!d) throw lastErr;

    number: +spec.number,
    meta: { area: p.area, subject: first.subject || BP.areas[p.area].subjects[0], unit: first.unit || "", standards: spec.standards.slice(),
            behavior: d.behavior || spec.behavior, difficulty: d.difficulty || spec.difficulty, source_ref: spec.ref_label || "", variation: d.variation || "" },

    bogi: Array.isArray(d.bogi) ? d.bogi.map(String) : [], data_box: d.data_box || "", question: d.question || "", explanation: d.explanation || "",
    wrong_choice_notes: d.wrong_choice_notes || {}, set_id: spec.set_id || null

function placeItem(item) {
  const p = cur();
  p.items = p.items.filter(i => i.number !== item.number).concat(item).sort((a, b) => a.number - b.number);

  commit();
}

function texVisible(s) { return String(s).replace(/\$([^$]*)\$/g, (m, t) => t.replace(/\\(dfrac|frac)\{([^}]*)\}\{([^}]*)\}/g, (x, f, a, b) => (a.length > b.length ? a : b)).replace(/\\[a-zA-Z]+/g, "x").replace(/[{}^_\s]/g, "")); }
function choiceCols(choices) {

  return w <= 4.4 ? "c5" : w <= 7.6 ? "c3" : "c1";
}
function itemHTML(it) {
  const pts = +it.points >= 3 ? ` [${it.points}점]` : "";

  if (it.data_box) h += `<div class="box">${mk(it.data_box)}</div>`;
  if (it.question) h += `<p class="q-after">${mk(it.question)}${pts}</p>`;
  if (it.bogi.length) h += `<div class="box bogi"><span class="bt">&lt;보 기&gt;</span>${it.bogi.map(b => `<div>${mk(b)}</div>`).join("")}</div>`;
  if (it.choices.length) h += `<div class="ch ${choiceCols(it.choices)}">${it.choices.map((c, i) => `<div>${cn(i + 1)}${mk(c)}</div>`).join("")}</div>`;
  else h += `<div class="sa ${+it.points >= 4 ? "big" : ""}"></div>`;

}
function examBlocks(p) {

  return `<html><body style="font-size:10pt">${h}</body></html>`;
}
function fixHwpxSection(xml) {
  const pics = [];
  xml = xml.replace(/<hp:run charPrIDRef="\d+"><hp:pic [\s\S]*?<\/hp:pic>(?:<hp:t\/>|<hp:t><\/hp:t>)?<\/hp:run>/g, m => { pics.push(m); return ""; });
  let out = "", last = 0, i = 0;
  for (const m of xml.matchAll(/⟦M⟧/g)) {
    const before = xml.slice(0, m.index), rs = before.lastIndexOf('<hp:run charPrIDRef="');
    const cp = rs >= 0 ? before.slice(rs).match(/charPrIDRef="(\d+)"/)[1] : "0";
    out += xml.slice(last, m.index) + (i < pics.length ? `</hp:t></hp:run>${pics[i++]}<hp:run charPrIDRef="${cp}"><hp:t>` : "");
    last = m.index + m[0].length;
  }
  out += xml.slice(last);
  while (i < pics.length) out = out.replace(/<\/hp:p>(?![\s\S]*<\/hp:p>)/, `${pics[i++]}</hp:p>`);
  out = out.replace(/<hp:run charPrIDRef="\d+"><hp:t><\/hp:t><\/hp:run>/g, "").replace(/<hp:t><\/hp:t>/g, "");
  out = out.replace(/(<hp:p [^>]*?)pageBreak="0"([^>]*>)((?:(?!<hp:p )[\s\S])*?)⟦PB⟧/g, (m, a, b, mid) => `${a}pageBreak="1"${b}${mid}`);
  return out.replace(/⟦PB⟧/g, "");
}
async function toHwpx(B, p) {
  const H = await needHwp();
  const bytes = await H.htmlToHwpx(await blocksToHwpHtml(B), { title: p.title, creator: "수능형 문항 출제실", page: { size: "A4", orientation: "portrait", margins: { left: 20, right: 20, top: 15, bottom: 15 } } });
  const zip = await JSZip.loadAsync(bytes);
  for (const name of Object.keys(zip.files).filter(n => /^Contents\/section\d+\.xml$/.test(n))) zip.file(name, fixHwpxSection(await zip.file(name).async("string")));
  const mt = await zip.file("mimetype").async("string");
  zip.file("mimetype", mt, { compression: "STORE" });
  return zip.generateAsync({ type: "uint8array", compression: "DEFLATE", mimeType: "application/hwp+zip" });
}

/* ---------- DOC(DOCX): docx 라이브러리 ---------- */
async function toDocx(B, p) {
  const D = await needDocx();
  const FONT = { ascii: "Times New Roman", hAnsi: "Times New Roman", eastAsia: "바탕", cs: "Times New Roman" };
  const GOTH = { ascii: "Arial", hAnsi: "Arial", eastAsia: "맑은 고딕", cs: "Arial" };
  const SZ = 20, W = 9400, C = D.AlignmentType.CENTER;
  const bytes = u => Uint8Array.from(atob(u.split(",")[1]), ch => ch.charCodeAt(0));
  const tr = (text, o = {}) => new D.TextRun({ text, size: o.size || SZ, bold: !!o.b, font: o.font || FONT });
  const runs = async segs => { const out = []; for (const sg of segs) {
    if (sg.tex != null) { try { const m = await texPng(sg.tex, sg.display, 13.4); out.push(new D.ImageRun({ type: "png", data: bytes(m.url), transformation: { width: m.w, height: m.h } })); } catch (e) { out.push(tr(sg.tex)); } }
    else out.push(new D.TextRun({ text: sg.text, size: SZ, font: FONT, bold: !!sg.b, italics: !!sg.i, underline: sg.u ? {} : undefined, superScript: !!sg.sup, subScript: !!sg.sub }));
  } return out; };
  const paras = async (src, o = {}) => { const ps = []; for (const segs of richParas(src)) ps.push(new D.Paragraph({ children: await runs(segs), spacing: { after: o.after ?? 80, line: 312, lineRule: D.LineRuleType.AUTO }, indent: o.indent ? { firstLine: 200 } : undefined })); return ps.length ? ps : [new D.Paragraph({})]; };
  const NONE = { style: D.BorderStyle.NONE, size: 0, color: "FFFFFF" }, LINE = { style: D.BorderStyle.SINGLE, size: 6, color: "000000" };
  const noB = { top: NONE, bottom: NONE, left: NONE, right: NONE, insideHorizontal: NONE, insideVertical: NONE };
  const allB = { top: LINE, bottom: LINE, left: LINE, right: LINE, insideHorizontal: LINE, insideVertical: LINE };
  const kids = [];
  for (const b of B) {
    if (b.k === "pb") kids.push(new D.Paragraph({ children: [new D.PageBreak()] }));
    else if (b.k === "head") kids.push(
      new D.Paragraph({ alignment: C, children: [tr(b.small, { size: 18, font: GOTH })] }),
      new D.Paragraph({ alignment: C, spacing: { after: 60 }, children: [tr(b.big, { size: 44, b: true, font: GOTH })] }),
      new D.Paragraph({ alignment: D.AlignmentType.RIGHT, border: { bottom: { style: D.BorderStyle.SINGLE, size: 12, color: "000000", space: 4 } }, children: [tr(b.side, { font: GOTH })] }),
      new D.Paragraph({ spacing: { before: 120, after: 200 }, children: [tr("성명: ____________________    수험 번호: ____________________", { font: GOTH })] }));
    else if (b.k === "p") kids.push(...await paras(b.src, { indent: b.indent }));
    else if (b.k === "box") {
      const cell = []; if (b.title) cell.push(new D.Paragraph({ alignment: C, children: [tr(b.title)] }));
      for (const r of b.rows) cell.push(...await paras(r, { after: 40 }));
      kids.push(new D.Table({ width: { size: W, type: D.WidthType.DXA }, borders: allB, rows: [new D.TableRow({ children: [new D.TableCell({ children: cell, margins: { top: 80, bottom: 80, left: 140, right: 140 } })] })] }), new D.Paragraph({ spacing: { after: 40 } }));
    }
    else if (b.k === "choices") {
      const rows = [];
      for (let i = 0; i < b.items.length; i += b.cols) {
        const cells = [];
        for (let j = 0; j < b.cols; j++) { const k = i + j; cells.push(new D.TableCell({ width: { size: Math.floor(W / b.cols), type: D.WidthType.DXA }, borders: noB, children: k < b.items.length ? await paras(`${CIRC[k]} ${b.items[k]}`, { after: 20 }) : [new D.Paragraph({})] })); }
        rows.push(new D.TableRow({ children: cells }));
      }
      kids.push(new D.Table({ width: { size: W, type: D.WidthType.DXA }, borders: noB, rows }));
    }
    else if (b.k === "gap") for (let i = 0; i < (b.n || 1); i++) kids.push(new D.Paragraph({}));
    else if (b.k === "h") kids.push(new D.Paragraph({ alignment: C, spacing: { before: 120, after: 160 }, children: [tr(b.text, { size: 30, b: true, font: GOTH })] }));
    else if (b.k === "h2") kids.push(new D.Paragraph({ spacing: { before: 200, after: 80 }, children: [tr(b.text, { size: 22, b: true, font: GOTH })] }));
    else if (b.k === "table") {
      const rows = b.rows.map(r => new D.TableRow({ children: r.map(c => new D.TableCell({
        columnSpan: c.span ? c.span + 1 : undefined, shading: c.head ? { fill: "EEEEEE", type: D.ShadingType.CLEAR, color: "auto" } : undefined,
        margins: { top: 40, bottom: 40, left: 80, right: 80 },
        children: String(c.t).split("\n").map(line => new D.Paragraph({ alignment: b.center ? C : undefined, children: [tr(line, { b: c.head, size: 18, font: GOTH })] })) })) }));
      kids.push(new D.Table({ width: { size: W, type: D.WidthType.DXA }, borders: allB, rows }), new D.Paragraph({ spacing: { after: 60 } }));
    }
  }
  const doc = new D.Document({ creator: "수능형 문항 출제실", title: p.title,
    styles: { default: { document: { run: { font: FONT, size: SZ } } } },
    sections: [{ properties: { page: { size: { width: 11906, height: 16838 }, margin: { top: 1134, bottom: 1134, left: 1247, right: 1247 } } }, children: kids }] });
  return D.Packer.toBlob(doc);
}

async function saveDoc(fmt, p, btn) {
  if (!p || !p.items.length) return toast("저장할 문항이 없습니다.");
  const pr = { ...parts };
  if (!Object.values(pr).some(Boolean)) return toast("‘인쇄·저장’ 탭에서 저장할 구성을 하나 이상 고르세요.");
  if (fmt === "pdf") return exportPDF(p, btn);
  const label = btn ? btn.innerHTML : ""; if (btn) { btn.disabled = true; btn.textContent = "만드는 중…"; }
  const tag = PARTS_DEF.filter(([k]) => pr[k]).map(([, l]) => l).join("+");
  try {
    const B = docBlocks(p, pr);
    if (fmt === "hwp") await saveFile(`${fileBase(p)}_${tag}.hwpx`, new Blob([await toHwpx(B, p)], { type: "application/hwp+zip" }));
    else await saveFile(`${fileBase(p)}_${tag}.docx`, await toDocx(B, p));
    toast(`${fmt === "hwp" ? "HWP(한글)" : "DOC(워드)"} 파일을 저장했습니다.`);
  } catch (e) {
    console.error(e);
    if (e?.code === "lib") toast("저장 도구를 불러오지 못했습니다. 인터넷 연결이나 학교 방화벽(cdn.jsdelivr.net)을 확인하세요.");
    else saveErr(e, fmt === "hwp" ? "HWP 파일" : "DOC 파일");
  }
  if (btn) { btn.disabled = false; btn.innerHTML = label; }
}

      <p class="hint">교육부 고시 제2022-33호 원문을 그대로 옮겨 적으세요. 추가한 성취기준은 내 계정에만 저장됩니다.</p>
      <label class="f" for="sArea">영역</label><select id="sArea">${areas.map(a => `<option value="${a}" ${a === sel ? "selected" : ""}>${esc(BP.areas[a].name)}</option>`).join("")}</select>
      <label class="f" for="sSubj">과목</label><select id="sSubj">${subjOpts.map(s => `<option>${esc(s)}</option>`).join("")}</select>
      <label class="f" for="sUnit">단원</label><input type="text" id="sUnit" placeholder="예: Ⅱ. 삼각함수">
      <label class="f" for="sCode">코드</label><input type="text" id="sCode" placeholder="예: [12대수02-01]">
      <label class="f" for="sText">성취기준 문장</label><textarea id="sText" rows="3"></textarea>
      <button class="btn primary" id="sAdd" style="margin-top:12px">성취기준 추가</button>
    </section>
    <section class="card">
      <h2>${esc(BP.areas[sel].name)} 성취기준 ${list.length}개</h2>
      <p class="hint">원문과 대조를 마친 항목은 ‘대조 완료’로 표시하세요. 표시되지 않은 성취기준을 쓴 문항은 검증에서 주의로 뜹니다.</p>
      <div style="overflow-x:auto"><table class="t"><thead><tr><th>코드</th><th>과목 · 단원</th><th>성취기준</th><th>대조</th><th></th></tr></thead><tbody>
      ${list.map(s => `<tr><td style="white-space:nowrap">${esc(s.code)}</td><td>${esc(s.subject)}<br><span class="hint">${esc(s.unit)}</span></td><td>${esc(s.text)}</td>
        <td><label style="white-space:nowrap"><input type="checkbox" data-ver="${esc(s.code)}" ${s.verified ? "checked" : ""}> 대조 완료</label></td>
        <td>${s.custom ? `<button class="btn small ghost" data-sx="${esc(s.code)}">삭제</button>` : ""}</td></tr>`).join("")}</tbody></table></div>
    </section>
  </div>`;
  $("#sArea").onchange = e => { state.stdArea = e.target.value; renderStandards(); };
  $("#sAdd").onclick = () => {
    const code = $("#sCode").value.trim(), text = $("#sText").value.trim(), unit = $("#sUnit").value.trim();
    if (!code || !text || !unit) return toast("단원, 코드, 문장을 모두 적으세요.");
    if (stdIndex()[code]) return toast(`${code}는 이미 있습니다.`);
    state.profile.extraStandards.push({ area: sel, subject: $("#sSubj").value, unit, code, text, verified: false });
    store.saveProfile(); toast("성취기준을 추가했습니다."); renderStandards();
  };
  $("#main").querySelectorAll("[data-ver]").forEach(el => el.onchange = () => { state.profile.verified[el.dataset.ver] = el.checked; store.saveProfile(); });
  $("#main").querySelectorAll("[data-sx]").forEach(b => b.onclick = () => { state.profile.extraStandards = state.profile.extraStandards.filter(s => s.code !== b.dataset.sx); store.saveProfile(); renderStandards(); });
}

/* ===================== 홈 ===================== */
const fmtDate = t => { const d = new Date(t || Date.now()); return `${d.getMonth() + 1}월 ${d.getDate()}일 ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`; };
function areaButtons() {
  return `<div class="areabtns">${Object.entries(BP.areas).map(([k, v]) => `<button class="btn" data-new="${k}"><b>${esc(v.name)}</b><small>${v.num_items}문항 · ${v.minutes}분 · ${v.total_points}점</small></button>`).join("")}</div>`;
}
function renderHome() {
  const list = Object.values(state.papers).sort((a, b) => b.updatedAt - a.updatedAt);
  $("#main").innerHTML = `
  <section class="card hero">
    <img src="${LOGO}" alt="" width="76" height="76">
    <div>
      <h2>수능형 문항 출제실</h2>
      <p>2022 개정 교육과정 성취기준으로 수능형 연습 문항을 만들고, 검토한 뒤 인쇄하거나 PDF·HWP·DOC 파일로 저장합니다.</p>
      <ol class="flow"><li><a href="#settings">AI 연결</a> ${aiReady() ? '<span class="pill ok">연결됨</span>' : '<span class="pill">필요</span>'}</li><li>시험지 만들기 · 출제</li><li><a href="#items">문항 검토</a></li><li><a href="#preview">인쇄·저장</a></li></ol>
    </div>
  </section>
  <div class="grid2">
    <section class="card"><h2>새 시험지 만들기</h2><p class="hint" style="margin:0">영역을 고르면 출제과목·배점·행동영역이 맞춰집니다.</p>${areaButtons()}</section>
    <section class="card">
      <h2>내 시험지 ${list.length}개</h2>
      ${list.length ? `<ul class="plist">${list.map(p => `<li class="${p.id === state.currentId ? "on" : ""}">
        <div><input type="text" value="${esc(p.name || "")}" placeholder="${esc(`${p.area_label} (${p.items.length}문항)`)}" data-ren="${p.id}" aria-label="시험지 이름 바꾸기">
        <span class="hint" style="display:block;padding-left:7px">${esc(p.area_label)} · ${p.items.length}문항 · ${fmtDate(p.updatedAt)}</span></div>
        <div class="pbtns"><button class="btn small primary" data-open="${p.id}">열기</button><button class="btn small ghost" data-delp="${p.id}" style="color:var(--pen)">삭제</button></div></li>`).join("")}</ul>
        <p class="hint" style="margin:0">이름 칸을 눌러 시험지 이름을 바꿀 수 있습니다. 시험지는 이 브라우저에만 저장됩니다.</p>`
      : `<p class="hint">아직 만든 시험지가 없습니다. 왼쪽에서 영역을 골라 시작하세요.</p>`}
    </section>
  </div>`;
  bindNewButtons();
  $("#main").querySelectorAll("[data-open]").forEach(b => b.onclick = () => { state.currentId = b.dataset.open; form._touchedNumber = false; form.set_id = ""; state.selItem = null; renderPaperSel(); go("write"); });
  $("#main").querySelectorAll("[data-ren]").forEach(el => el.addEventListener("input", () => { const p = state.papers[el.dataset.ren]; if (!p) return; p.name = el.value.trim(); store.savePaper(p); renderPaperSel(); }));
  $("#main").querySelectorAll("[data-delp]").forEach(b => b.onclick = async () => {
    const p = state.papers[b.dataset.delp]; if (!p || !confirm(`‘${paperName(p)}’을 삭제할까요? 되돌릴 수 없습니다.`)) return;
    delete state.papers[p.id]; await store.deletePaper(p.id);
    if (state.currentId === p.id) state.currentId = Object.values(state.papers).sort((a, b) => b.updatedAt - a.updatedAt)[0]?.id || null;
    renderPaperSel(); renderHome(); toast("시험지를 삭제했습니다.");
  });
}

/* ===================== 공통 ===================== */
function renderNoPaper() {
  $("#main").innerHTML = `<div class="card" style="max-width:720px;margin:20px auto">
    <h2>먼저 시험지를 만들거나 고르세요</h2>
    <p class="hint">영역을 고르면 새 시험지가 만들어집니다. 이미 만든 시험지는 <a href="#home">홈</a>이나 위쪽 목록에서 고를 수 있습니다.</p>
    ${areaButtons()}</div>`;
  bindNewButtons();
}
function bindNewButtons() { $("#main").querySelectorAll("[data-new]").forEach(b => b.onclick = () => createPaper(b.dataset.new)); }
function createPaper(area) { addPaper(blankPaper(area), `${BP.areas[area].name} 시험지를 만들었습니다.`); }
function addPaper(p, msg) { state.papers[p.id] = p; state.currentId = p.id; form._touchedNumber = false; store.savePaper(p); renderPaperSel(); go("write"); toast(msg); }
function renderPaperSel() {
  const sel = $("#paperSel"); const list = Object.values(state.papers).sort((a, b) => b.updatedAt - a.updatedAt);
  sel.innerHTML = list.length ? list.map(p => `<option value="${p.id}" ${p.id === state.currentId ? "selected" : ""}>${esc(paperName(p))}</option>`).join("") : `<option value="">시험지 없음</option>`;
}
function updateTabCounts() {
  const p = cur(); const a = $('#tabs a[href="#items"]');
  a.innerHTML = `문항 편집${p ? `<span class="n">${p.items.length}</span>` : ""}`;
}
async function wipeAll() {
  if (!confirm("이 기기에 저장된 시험지, 성취기준 설정, API 키를 모두 지울까요? 되돌릴 수 없습니다.")) return;
  Object.values(store.timers).forEach(clearTimeout);
  if (store.mode === "db") { for (const id of Object.keys(state.papers)) await store.deletePaper(id); state.profile = { extraStandards: [], verified: {} }; await store.saveProfile(); }
  try {
    Object.keys(localStorage).filter(k => k.startsWith("sn_")).forEach(k => localStorage.removeItem(k));
    Object.keys(sessionStorage).filter(k => k.startsWith("sn_")).forEach(k => sessionStorage.removeItem(k));
  } catch (e) {}
  state.papers = {}; state.currentId = null; state.profile = { extraStandards: [], verified: {} };
  Object.assign(AI, { provider: IN_CLAUDE ? "claude_account" : "", key: "", model: "", models: [], forced: "", gap: null });
  renderPaperSel(); go("home"); toast("이 기기의 데이터를 모두 지웠습니다.");
}

/* ===================== 개인정보 처리방침 팝업 ===================== */
function openPrivacy(first) {
  const m = $("#pmodal"), back = document.activeElement;
  m.innerHTML = `<div class="pm-back" data-pclose></div>
  <div class="pm" role="dialog" aria-modal="true" aria-labelledby="pmT">
    <div class="pm-h"><h2 id="pmT">${first ? "개인정보 처리 안내" : "개인정보 처리방침"}</h2><button type="button" class="btn small ghost" data-pclose>닫기</button></div>
    ${first ? `<div class="pm-sum"><b>사용하기 전에 확인해 주세요</b><ul>
      <li>이 앱은 개인정보를 수집하지 않습니다. 시험지와 API 키는 <b>이 기기의 브라우저에만</b> 저장됩니다.</li>
      <li>AI 기능을 쓰면 문항 조건·참고 문항·지문 등이 <b>이용자가 넣은 API 키의 AI 서비스</b>로 직접 전송됩니다(제8조·제9조).</li>
      <li>학생 이름·학번·성적 등 개인정보는 입력하지 마세요.</li></ul></div>` : ""}
    <div class="pm-body" tabindex="0">${PRIVACY_HTML}</div>
    <div class="pm-f">${first ? `<label class="checks"><input type="checkbox" id="pmNo"> 다시 보지 않기</label>` : "<span></span>"}<button type="button" class="btn primary" id="pmOk">확인</button></div>
  </div>`;
  m.hidden = false; document.body.style.overflow = "hidden";
  const close = () => {
    try { if (first) { if ($("#pmNo")?.checked) localStorage.setItem("sn_privacy_seen", PRIVACY_POPUP.version); sessionStorage.setItem("sn_privacy_session", "1"); } } catch (e) {}
    m.hidden = true; m.innerHTML = ""; document.body.style.overflow = ""; document.removeEventListener("keydown", esc_); back?.focus?.();
  };
  const esc_ = e => { if (e.key === "Escape") close(); };
  document.addEventListener("keydown", esc_);
  m.querySelectorAll("[data-pclose]").forEach(x => x.onclick = close);
  $("#pmOk").onclick = close; $("#pmOk").focus();
}
function maybeFirstPrivacy() {
  if (!PRIVACY_POPUP.showOnFirstVisit) return;
  let seen = false;
  try { seen = localStorage.getItem("sn_privacy_seen") === PRIVACY_POPUP.version || sessionStorage.getItem("sn_privacy_session") === "1"; } catch (e) {}
  if (!seen) openPrivacy(true);
}
$("#privLink").onclick = () => openPrivacy(false);

/* ===== 라우팅 ===== */
const VIEWS = { home: renderHome, write: renderWrite, items: renderItems, preview: renderPreview, standards: renderStandards, settings: renderSettings };
function go(tab) {
  state.tab = VIEWS[tab] ? tab : "home";
  try { history.replaceState(null, "", location.pathname + location.search + "#" + state.tab); } catch (e) {}
  route(state.tab); window.scrollTo(0, 0);
}
document.addEventListener("click", e => {
  const a = e.target.closest && e.target.closest('a[href^="#"]');
  if (!a || a.target === "_blank") return;
  const t = a.getAttribute("href").slice(1);
  if (!VIEWS[t]) return;
  e.preventDefault(); go(t);
});
function route(tab) {
  const h = tab || state.tab || (location.hash || "#home").slice(1); state.tab = VIEWS[h] ? h : "home";
  document.querySelectorAll("#tabs a").forEach(a => a.setAttribute("aria-current", a.getAttribute("href") === "#" + state.tab ? "page" : "false"));
  updateTabCounts();
  if (!["home", "standards", "settings"].includes(state.tab) && !cur()) return renderNoPaper();
  VIEWS[state.tab]();
}
window.addEventListener("hashchange", () => route((location.hash || "#home").slice(1)));
let rz; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { if (state.tab === "preview" && cur()?.items.length) layoutPreview(cur()); }, 200); });

$("#paperSel").onchange = e => { if (!e.target.value) return; state.currentId = e.target.value; form._touchedNumber = false; form.set_id = ""; state.selItem = null; if (state.tab === "home") go("write"); else route(); };
$("#newPaperBtn").onclick = () => go("home");
$("#homeTitle").onclick = () => go("home");

/* ===== 시작 ===== */
(async function start() {
  setStatus("불러오는 중…");
  loadAI();
  state.tab = (location.hash || "#home").slice(1);
  route();
  const timeout = new Promise(r => setTimeout(r, 10000));
  if (IN_CLAUDE) {
    await Promise.race([store.init(), timeout]);
    claude.use("sample").then(f => { sampleFn = f; if (["write", "items", "settings", "home"].includes(state.tab)) route(); }).catch(() => {});
    claude.use("downloads").then(d => { downloadsNS = d; }).catch(() => {});
  }
  try {
    const { papers, profile } = await Promise.race([store.loadAll(), timeout.then(() => ({ papers: {}, profile: {} }))]);
    Object.values(papers).forEach(p => { p.items = (p.items || []).map(normalizeItem); p.sets ||= []; p.plan ||= []; });
    state.papers = papers;
    state.profile = Object.assign({ extraStandards: [], verified: {} }, profile);
    state.currentId = Object.values(papers).sort((a, b) => b.updatedAt - a.updatedAt)[0]?.id || null;
    setStatus(store.mode === "db" ? "계정에 저장" : "이 브라우저에 저장");
  } catch (e) { setStatus("불러오기 실패"); }
  renderPaperSel(); route();
  maybeFirstPrivacy();
})();
</script>
</body>
</html>
