<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gabriel Math · 수학 웹앱 자료실</title>
<meta name="description" content="수업에서 바로 쓰는 수학 교육용 웹앱 모음">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📐</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=IBM+Plex+Sans+KR:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css">
<style>
.hero{padding:40px 0 24px}
.hero h1{font-family:"Gowun Batang",serif;font-size:clamp(2rem,6vw,3.4rem);line-height:1.2;margin:0 0 12px}
.hero p{color:var(--muted);max-width:34em;margin:0}
#curve{width:100%;height:140px;display:block;margin:28px 0 8px}
h2{font-family:"Gowun Batang",serif;font-size:1.5rem;margin:48px 0 16px}
.apps{list-style:none;margin:0;padding:0;border-top:2px solid var(--ink)}
.apps li{border-bottom:1px solid var(--line)}
.apps a{display:grid;grid-template-columns:5.5rem 1fr;gap:16px;padding:18px 4px;text-decoration:none;color:var(--ink);background:color-mix(in srgb,var(--paper) 88%,transparent)}
.apps a:hover .t{background:linear-gradient(transparent 55%,var(--mark) 55%)}
.unit{font-size:.85rem;color:var(--blue);font-weight:600;padding-top:3px}
.t{font-weight:600;font-size:1.1rem}
.d{color:var(--muted);font-size:.95rem;margin-top:2px}
.soon a{pointer-events:none;opacity:.55}
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><a class="logo" href="/">Gabriel<span>Math</span></a></header>

  <section class="hero">
    <h1>손으로 움직여 보는 수학</h1>
    <p>값을 바꾸고, 그래프를 끌어 보고, 규칙을 직접 찾아보세요. 수업 시간과 복습에 바로 쓸 수 있는 웹앱을 모았습니다.</p>
    <canvas id="curve" aria-hidden="true"></canvas>
  </section>

  <h2>웹앱 목록</h2>
  <ul class="apps">
    <!-- ▼ 새 웹앱을 추가할 때 아래 <li> 한 덩어리를 복사해서 주소(href)와 글자만 바꾸세요 -->
    <li><a href="/math1/">
      <div class="unit">공통수학</div>
      <div><div class="t">공통수학 개념 탐구 실험실</div>
      <div class="d">공통수학1·2를 19차시 개념기반 탐구로 엮었습니다. 도구를 직접 움직여 사실을 모으고, 자기 문장으로 개념을 정리합니다.</div></div>
    </a></li>
    <li class="soon"><a href="#" tabindex="-1" aria-disabled="true">
      <div class="unit">준비 중</div>
      <div><div class="t">다음 자료</div>
      <div class="d">곧 추가됩니다.</div></div>
    </a></li>
    <!-- ▲ 여기까지 -->
  </ul>

  <footer>© Gabriel Math · 문의 <a href="mailto:gabriel@gabrielmath.kr">gabriel@gabrielmath.kr</a></footer>
</div>
<script>
(function(){
  const c=document.getElementById('curve'),x=c.getContext('2d');
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  function size(){const r=devicePixelRatio||1;c.width=c.clientWidth*r;c.height=c.clientHeight*r;x.setTransform(r,0,0,r,0,0)}
  size();addEventListener('resize',()=>{size();if(reduce)draw(1)});
  const color=getComputedStyle(document.documentElement).getPropertyValue('--blue').trim();
  function draw(p){
    const w=c.clientWidth,h=c.clientHeight;x.clearRect(0,0,w,h);
    x.strokeStyle=color;x.lineWidth=3;x.lineCap='round';x.beginPath();
    for(let i=0;i<=w*p;i+=2){const y=h/2-Math.sin(i/w*Math.PI*4)*h*0.36*Math.exp(-i/w*0.6);i?x.lineTo(i,y):x.moveTo(i,y)}
    x.stroke();
  }
  if(reduce){draw(1);return}
  let t0;function step(t){t0??=t;const p=Math.min((t-t0)/1800,1);draw(1-Math.pow(1-p,3));if(p<1)requestAnimationFrame(step)}
  requestAnimationFrame(step);
})();
</script>
</body>
</html>
